stages:
  - build
compile_pdf:
  image: aergus/latex
  script:
    - cd thesis/minimovka && latexmk -pdf minimovka.tex
    - cd ishaan-ahuja/conference/proceedings/HardProbes2023/ && latexmk -pdf skeleton.tex

  stage: build
  artifacts:
    paths:
      - "thesis/minimovka/minimovka.pdf"
      - "conference/proceedings/HardProbes2023/proceedings.pdf"
